# Production shape for the web app. Set NEXT_PUBLIC_API_BASE_URL in the shell.
# This file is not started by the app. The API runs from its own repository.

name: ai-chatbot-web

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    ports:
      - "3000:3000"
